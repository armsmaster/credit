# Single entry point: UI shell, microfrontends, APIs and Keycloak behind one origin
# (no CORS, cookies and tokens stay first-party).
# Upstreams are resolved lazily through Docker DNS, so the gateway starts even
# when some services are still down.

log_format json escape=json '{"level":"INFO","logger":"gateway","service":"gateway",'
  '"message":"$request_method $uri $status","method":"$request_method","path":"$uri",'
  '"status":$status,"duration_ms":$request_time,"bytes":$body_bytes_sent,'
  '"request_id":"$request_id","remote_addr":"$remote_addr","upstream":"$upstream_addr"}';

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  access_log /dev/stdout json;

  resolver 127.0.0.11 valid=10s ipv6=off;
  client_max_body_size 10m;

  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Request-ID $request_id;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;

  location = /gateway/health {
    access_log off;
    return 200 "ok\n";
  }

  location /auth/ {
    set $up_kc keycloak:8080;
    proxy_pass http://$up_kc;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
  }

  # ---- APIs (one location per backend service) ----
  location /api/admin/ {
    set $up_admin admin:8000;
    proxy_pass http://$up_admin;
    proxy_read_timeout 120s;
  }
  location /api/curves/ {
    set $up_curves curves:8000;
    proxy_pass http://$up_curves;
    proxy_read_timeout 120s;
  }
  location /api/credit/ {
    set $up_credit credit:8000;
    proxy_pass http://$up_credit;
    proxy_read_timeout 180s;
  }

  # ---- Microfrontends (each is an independently deployed container) ----
  location /mfe/admin/ {
    set $up_mfe_admin mfe-admin:80;
    proxy_pass http://$up_mfe_admin;
  }
  location /mfe/curves/ {
    set $up_mfe_curves mfe-curves:80;
    proxy_pass http://$up_mfe_curves;
  }
  location /mfe/credit/ {
    set $up_mfe_credit mfe-credit:80;
    proxy_pass http://$up_mfe_credit;
  }

  # ---- Shell (host application) ----
  location / {
    set $up_shell shell:80;
    proxy_pass http://$up_shell;
  }
}
