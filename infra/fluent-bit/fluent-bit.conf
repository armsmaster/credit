# Containers ship stdout/stderr here through Docker's fluentd logging driver.
# JSON lines (our services, gateway) are expanded into fields; plain lines
# (Keycloak, Postgres) keep their text in `message`.

[SERVICE]
    Flush                     2
    Log_Level                 warn
    Parsers_File              parsers.conf
    HTTP_Server               On
    HTTP_Listen               0.0.0.0
    HTTP_Port                 2020
    storage.path              /fluent-bit/buffer
    storage.sync              normal
    storage.backlog.mem_limit 16M

[INPUT]
    Name          forward
    Listen        0.0.0.0
    Port          24224
    storage.type  filesystem

[FILTER]
    Name          parser
    Match         *
    Key_Name      log
    Parser        json
    Reserve_Data  On

[FILTER]
    Name          modify
    Match         *
    Rename        log message

[FILTER]
    Name          modify
    Match         *
    Condition     Key_does_not_exist service
    Copy          com.docker.compose.service service

[FILTER]
    Name          modify
    Match         *
    Remove        com.docker.compose.service

[OUTPUT]
    Name                es
    Match               *
    Host                elasticsearch
    Port                9200
    Logstash_Format     On
    Logstash_Prefix     cds-logs
    Logstash_DateFormat %Y.%m.%d
    Time_Key            @timestamp
    Suppress_Type_Name  On
    Replace_Dots        On
    Buffer_Size         5M
    Retry_Limit         False
    storage.total_limit_size 512M
