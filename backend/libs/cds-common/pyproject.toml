[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cds-common"
version = "0.1.0"
description = "Shared platform code for CDS microservices: auth, db, audit, task queue, logging"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "pyjwt[crypto]>=2.9,<3",
]

[tool.setuptools.packages.find]
include = ["cds_common*"]
