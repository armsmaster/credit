[alembic]
script_location = migrations
# DATABASE_URL is read from the environment in migrations/env.py

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = {"level": "%(levelname)s", "logger": "alembic", "message": "%(message)s"}
